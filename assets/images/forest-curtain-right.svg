<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 800" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Deep Vintage Woodland Gradients -->
    <linearGradient id="canopyBaseR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#192a2d" />
      <stop offset="35%" stop-color="#2a4549" />
      <stop offset="70%" stop-color="#345459" />
      <stop offset="100%" stop-color="#142124" />
    </linearGradient>

    <radialGradient id="foliagePuffR" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5a8086" />
      <stop offset="45%" stop-color="#3b5d62" />
      <stop offset="85%" stop-color="#223a3e" />
      <stop offset="100%" stop-color="#122022" />
    </radialGradient>

    <!-- Stipple / Engraving Pattern -->
    <pattern id="stippleWoodR" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="4" r="1.2" fill="#8cb3b8" opacity="0.35" />
      <circle cx="6" cy="12" r="1.4" fill="#a4c6cb" opacity="0.3" />
      <circle cx="12" cy="16" r="1" fill="#71989d" opacity="0.4" />
      <path d="M18,8 Q12,5 8,8" stroke="#162527" stroke-width="0.75" fill="none" opacity="0.6" />
      <path d="M10,15 Q5,12 2,15" stroke="#162527" stroke-width="0.75" fill="none" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Solid Deep Base -->
  <rect width="240" height="800" fill="url(#canopyBaseR)" />

  <!-- Dense Textured Bush & Leaf Puff Layers -->
  <g stroke="#152426" stroke-width="0.8">
    <!-- Top Layer -->
    <ellipse cx="180" cy="90" rx="95" ry="80" fill="url(#foliagePuffR)" />
    <ellipse cx="70" cy="70" rx="100" ry="85" fill="url(#foliagePuffR)" />
    <ellipse cx="10" cy="140" rx="85" ry="90" fill="url(#foliagePuffR)" />
    <ellipse cx="130" cy="180" rx="90" ry="80" fill="url(#foliagePuffR)" />

    <!-- Mid-Upper Layer -->
    <ellipse cx="200" cy="260" rx="90" ry="95" fill="url(#foliagePuffR)" />
    <ellipse cx="80" cy="270" rx="105" ry="95" fill="url(#foliagePuffR)" />
    <ellipse cx="5" cy="330" rx="80" ry="90" fill="url(#foliagePuffR)" />
    <ellipse cx="150" cy="370" rx="100" ry="90" fill="url(#foliagePuffR)" />

    <!-- Mid-Lower Layer -->
    <ellipse cx="50" cy="430" rx="95" ry="100" fill="url(#foliagePuffR)" />
    <ellipse cx="180" cy="480" rx="95" ry="95" fill="url(#foliagePuffR)" />
    <ellipse cx="70" cy="530" rx="110" ry="100" fill="url(#foliagePuffR)" />
    <ellipse cx="5" cy="590" rx="80" ry="90" fill="url(#foliagePuffR)" />

    <!-- Lower Layer -->
    <ellipse cx="160" cy="620" rx="100" ry="105" fill="url(#foliagePuffR)" />
    <ellipse cx="60" cy="690" rx="105" ry="105" fill="url(#foliagePuffR)" />
    <ellipse cx="190" cy="740" rx="90" ry="95" fill="url(#foliagePuffR)" />
    <ellipse cx="30" cy="780" rx="85" ry="85" fill="url(#foliagePuffR)" />
  </g>

  <!-- Overlay Texture Stipple for Woodcut Engraving Look -->
  <rect width="240" height="800" fill="url(#stippleWoodR)" />

  <!-- Detailed Branching Network -->
  <g fill="none" stroke="#121d1f" stroke-linecap="round">
    <!-- Main Tree Trunk Along Right Boundary -->
    <path d="M225,800 Q205,620 215,460 Q225,310 200,160 Q180,60 215,0" stroke-width="14" />
    <path d="M215,650 Q165,560 95,590" stroke-width="7" />
    <path d="M215,500 Q155,420 75,450" stroke-width="8" />
    <path d="M220,350 Q145,270 65,300" stroke-width="9" />
    <path d="M205,210 Q130,130 50,160" stroke-width="7" />
    <path d="M200,100 Q135,40 70,60" stroke-width="6" />

    <!-- Branchlet Splinters -->
    <path d="M130,570 Q95,530 45,550" stroke-width="4" />
    <path d="M115,435 Q75,395 30,415" stroke-width="4.5" />
    <path d="M110,285 Q65,245 20,265" stroke-width="5" />
    <path d="M95,145 Q55,110 15,125" stroke-width="4" />
  </g>

  <!-- Fine Engraved White/Cyan Leaf Accents -->
  <g fill="#bad4d8" opacity="0.6">
    <circle cx="80" cy="65" r="2.5" />
    <circle cx="30" cy="130" r="3" />
    <circle cx="90" cy="250" r="2.5" />
    <circle cx="35" cy="315" r="3" />
    <circle cx="75" cy="410" r="3.2" />
    <circle cx="20" cy="510" r="2.8" />
    <circle cx="95" cy="610" r="3.5" />
    <circle cx="45" cy="680" r="3" />
  </g>
</svg>
