<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 160" width="100%" height="100%" preserveAspectRatio="xMidYMax meet">
  <defs>
    <!-- Gold Leaf Gradient -->
    <linearGradient id="goldLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecd79b" />
      <stop offset="50%" stop-color="#caa357" />
      <stop offset="100%" stop-color="#8c6d2d" />
    </linearGradient>

    <!-- Dark Slate Eucalyptus Gradient -->
    <linearGradient id="slateLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e6871" />
      <stop offset="50%" stop-color="#34484f" />
      <stop offset="100%" stop-color="#1f2c31" />
    </linearGradient>

    <!-- Petal Gradient (White to Soft Cream) -->
    <linearGradient id="rosePetalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8f4ee" />
      <stop offset="100%" stop-color="#e5dbc9" />
    </linearGradient>

    <radialGradient id="roseCoreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8d5ae" />
      <stop offset="60%" stop-color="#caa357" />
      <stop offset="100%" stop-color="#93722b" />
    </radialGradient>

    <filter id="softFlowerShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1c272b" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Leaves Layer (Left & Right Dark Slate Foliage) -->
  <g filter="url(#softFlowerShadow)">
    <!-- Left Dark Leaves -->
    <path d="M-10,130 Q30,70 70,100 Q40,140 -10,130 Z" fill="url(#slateLeafGrad)" />
    <path d="M15,110 Q55,60 95,90 Q65,130 15,110 Z" fill="url(#slateLeafGrad)" />
    <path d="M40,130 Q80,80 120,110 Q90,150 40,130 Z" fill="url(#slateLeafGrad)" opacity="0.9" />

    <!-- Right Dark Leaves -->
    <path d="M460,130 Q420,70 380,100 Q410,140 460,130 Z" fill="url(#slateLeafGrad)" />
    <path d="M435,110 Q395,60 355,90 Q385,130 435,110 Z" fill="url(#slateLeafGrad)" />
    <path d="M410,130 Q370,80 330,110 Q360,150 410,130 Z" fill="url(#slateLeafGrad)" opacity="0.9" />
  </g>

  <!-- Golden Foliage Sprays (Left & Right) -->
  <g filter="url(#softFlowerShadow)">
    <!-- Left Gold Foliage -->
    <path d="M20,125 Q65,65 110,95 Q75,135 20,125 Z" fill="url(#goldLeafGrad)" />
    <path d="M45,105 Q95,50 140,80 Q105,120 45,105 Z" fill="url(#goldLeafGrad)" />
    <path d="M70,120 Q120,70 160,105 Q125,145 70,120 Z" fill="url(#goldLeafGrad)" opacity="0.95" />

    <!-- Right Gold Foliage -->
    <path d="M430,125 Q385,65 340,95 Q375,135 430,125 Z" fill="url(#goldLeafGrad)" />
    <path d="M405,105 Q355,50 310,80 Q345,120 405,105 Z" fill="url(#goldLeafGrad)" />
    <path d="M380,120 Q330,70 290,105 Q325,145 380,120 Z" fill="url(#goldLeafGrad)" opacity="0.95" />

    <!-- Center Gold Leaves -->
    <path d="M190,135 Q225,90 260,135 Q225,155 190,135 Z" fill="url(#goldLeafGrad)" opacity="0.85" />
    <path d="M160,130 Q200,95 230,130 Z" fill="url(#goldLeafGrad)" />
    <path d="M290,130 Q250,95 220,130 Z" fill="url(#goldLeafGrad)" />
  </g>

  <!-- Main Floral Blooms (Realistic Layered White Peonies / Roses) -->
  <g filter="url(#softFlowerShadow)">
    <!-- Far-Left Blossom -->
    <g transform="translate(60, 115) scale(0.95)">
      <!-- Petal Ring 1 -->
      <path d="M0,-24 C14,-24 24,-14 24,0 C24,14 14,24 0,24 C-14,24 -24,14 -24,0 C-24,-14 -14,-24 0,-24 Z" fill="url(#rosePetalGrad)" opacity="0.7" />
      <path d="M-12,-18 C2,-28 18,-20 20,-6 C22,8 10,22 -4,20 C-18,18 -26,4 -20,-10 Z" fill="url(#rosePetalGrad)" />
      <!-- Petal Ring 2 -->
      <circle cx="-6" cy="-6" r="14" fill="url(#rosePetalGrad)" />
      <circle cx="8" cy="-4" r="13" fill="url(#rosePetalGrad)" />
      <circle cx="5" cy="8" r="14" fill="url(#rosePetalGrad)" />
      <circle cx="-7" cy="7" r="13" fill="url(#rosePetalGrad)" />
      <!-- Center Gold Pistil -->
      <circle cx="0" cy="0" r="7" fill="url(#roseCoreGrad)" />
    </g>

    <!-- Center-Left Rose / Peony (Featured in reference photo) -->
    <g transform="translate(150, 105) scale(1.15)">
      <!-- Outer Petals -->
      <path d="M-15,-20 C0,-28 20,-24 25,-10 C30,4 20,22 5,25 C-10,28 -25,15 -25,-2 C-25,-12 -20,-18 -15,-20 Z" fill="url(#rosePetalGrad)" />
      <circle cx="-12" cy="-4" r="15" fill="url(#rosePetalGrad)" />
      <circle cx="12" cy="-4" r="15" fill="url(#rosePetalGrad)" />
      <circle cx="0" cy="12" r="16" fill="url(#rosePetalGrad)" />
      <!-- Inner Swirled Rose Petals -->
      <path d="M-8,-8 C0,-14 12,-10 10,0 C8,10 -2,12 -8,6 C-12,0 -12,-6 -8,-8 Z" fill="#ffffff" stroke="#caa357" stroke-width="0.8" opacity="0.9" />
      <circle cx="0" cy="1" r="5.5" fill="url(#roseCoreGrad)" />
    </g>

    <!-- Center-Right Rose / Peony (Featured in reference photo) -->
    <g transform="translate(300, 105) scale(1.15)">
      <!-- Outer Petals -->
      <path d="M15,-20 C0,-28 -20,-24 -25,-10 C-30,4 -20,22 -5,25 C10,28 25,15 25,-2 C25,-12 20,-18 15,-20 Z" fill="url(#rosePetalGrad)" />
      <circle cx="12" cy="-4" r="15" fill="url(#rosePetalGrad)" />
      <circle cx="-12" cy="-4" r="15" fill="url(#rosePetalGrad)" />
      <circle cx="0" cy="12" r="16" fill="url(#rosePetalGrad)" />
      <!-- Inner Swirled Rose Petals -->
      <path d="M8,-8 C0,-14 -12,-10 -10,0 C-8,10 2,12 8,6 C12,0 12,-6 8,-8 Z" fill="#ffffff" stroke="#caa357" stroke-width="0.8" opacity="0.9" />
      <circle cx="0" cy="1" r="5.5" fill="url(#roseCoreGrad)" />
    </g>

    <!-- Far-Right Blossom -->
    <g transform="translate(390, 115) scale(0.95)">
      <path d="M0,-24 C14,-24 24,-14 24,0 C24,14 14,24 0,24 C-14,24 -24,14 -24,0 C-24,-14 -14,-24 0,-24 Z" fill="url(#rosePetalGrad)" opacity="0.7" />
      <path d="M12,-18 C-2,-28 -18,-20 -20,-6 C-22,8 -10,22 4,20 C18,18 26,4 20,-10 Z" fill="url(#rosePetalGrad)" />
      <circle cx="6" cy="-6" r="14" fill="url(#rosePetalGrad)" />
      <circle cx="-8" cy="-4" r="13" fill="url(#rosePetalGrad)" />
      <circle cx="-5" cy="8" r="14" fill="url(#rosePetalGrad)" />
      <circle cx="7" cy="7" r="13" fill="url(#rosePetalGrad)" />
      <circle cx="0" cy="0" r="7" fill="url(#roseCoreGrad)" />
    </g>

    <!-- Center Tiny Floating White Bud -->
    <circle cx="225" cy="125" r="9" fill="url(#rosePetalGrad)" />
    <circle cx="225" cy="125" r="3.5" fill="url(#roseCoreGrad)" />
  </g>
</svg>
