<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 500" fill="none">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="cardGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2dfb3"/>
      <stop offset="50%" stop-color="#c9a85c"/>
      <stop offset="100%" stop-color="#9a7832"/>
    </linearGradient>
    <linearGradient id="cardGoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b99650"/>
      <stop offset="100%" stop-color="#6e5020"/>
    </linearGradient>

    <!-- Petal Gradients -->
    <linearGradient id="cardPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8f2eb"/>
      <stop offset="100%" stop-color="#ebdcc8"/>
    </linearGradient>
    <linearGradient id="cardPetalPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f7ebe6"/>
      <stop offset="100%" stop-color="#e8cfc8"/>
    </linearGradient>

    <!-- Flower Center Radial -->
    <radialGradient id="cardCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5e0a0"/>
      <stop offset="70%" stop-color="#d4a84e"/>
      <stop offset="100%" stop-color="#9a7028"/>
    </radialGradient>

    <!-- Leaf Gradients -->
    <linearGradient id="cardTealLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a686d"/>
      <stop offset="100%" stop-color="#22383c"/>
    </linearGradient>
    <linearGradient id="cardSoftLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a9890"/>
      <stop offset="100%" stop-color="#4a6860"/>
    </linearGradient>
  </defs>

  <!-- ==================== TOP-LEFT TREE & BRANCHES ==================== -->
  <g opacity="0.85">
    <!-- Branch structure -->
    <path d="M-5,30 Q25,45 40,75 Q50,105 42,135" stroke="#7a6040" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M22,48 Q45,40 68,52" stroke="#8a7050" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M38,72 Q65,70 82,88" stroke="#8a7050" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M44,100 Q62,110 75,125" stroke="#8a7050" stroke-width="1.3" stroke-linecap="round" fill="none"/>

    <!-- Golden twigs & foliage -->
    <ellipse cx="65" cy="46" rx="10" ry="6" fill="url(#cardGold)" opacity="0.85" transform="rotate(-15 65 46)"/>
    <ellipse cx="78" cy="85" rx="11" ry="6.5" fill="url(#cardGold)" opacity="0.85" transform="rotate(25 78 85)"/>
    <ellipse cx="28" cy="38" rx="9" ry="5.5" fill="url(#cardTealLeaf)" opacity="0.8" transform="rotate(-30 28 38)"/>
    <ellipse cx="50" cy="62" rx="8" ry="5" fill="url(#cardSoftLeaf)" opacity="0.8" transform="rotate(15 50 62)"/>

    <!-- Top Flower cluster -->
    <g transform="translate(68, 52)">
      <circle cx="0" cy="-7" r="5.5" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="6" cy="-2" r="5.5" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="4" cy="6" r="5.5" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="-4" cy="6" r="5.5" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="-6" cy="-2" r="5.5" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="0" cy="0" r="2.8" fill="url(#cardCenter)"/>
    </g>

    <g transform="translate(82, 88)">
      <circle cx="0" cy="-6" r="4.8" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="5" cy="-2" r="4.8" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="3" cy="5" r="4.8" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="-3" cy="5" r="4.8" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="-5" cy="-2" r="4.8" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="0" cy="0" r="2.5" fill="url(#cardCenter)"/>
    </g>

    <!-- Floating petal -->
    <ellipse cx="92" cy="110" rx="3.5" ry="2" fill="url(#cardPetal)" opacity="0.75" transform="rotate(20 92 110)"/>
  </g>

  <!-- ==================== MID-LEFT BOTANICAL & FLOWERING STEMS ==================== -->
  <g opacity="0.8">
    <path d="M-8,210 Q25,225 35,255 Q42,285 28,315" stroke="#7a6040" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M18,220 Q48,210 65,222" stroke="#8a7050" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M30,245 Q55,250 72,268" stroke="#8a7050" stroke-width="1.3" stroke-linecap="round" fill="none"/>

    <!-- Leaves -->
    <path d="M22,212 Q38,205 32,222 Q18,225 22,212 Z" fill="url(#cardTealLeaf)" opacity="0.85"/>
    <path d="M48,238 Q65,232 58,250 Q42,252 48,238 Z" fill="url(#cardSoftLeaf)" opacity="0.8"/>
    <path d="M15,255 Q28,268 18,280 Q8,272 15,255 Z" fill="url(#cardGold)" opacity="0.85"/>

    <!-- Flower -->
    <g transform="translate(65, 222)">
      <circle cx="0" cy="-6" r="5" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="5.5" cy="-1.5" r="5" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="3.5" cy="5" r="5" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="-3.5" cy="5" r="5" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="-5.5" cy="-1.5" r="5" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="0" cy="0" r="2.5" fill="url(#cardCenter)"/>
    </g>

    <g transform="translate(72, 268)">
      <circle cx="0" cy="-5" r="4" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="4.5" cy="-1.5" r="4" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="3" cy="4" r="4" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="-3" cy="4" r="4" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="-4.5" cy="-1.5" r="4" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="0" cy="0" r="2" fill="url(#cardCenter)"/>
    </g>
  </g>

  <!-- ==================== BOTTOM-LEFT FLOWERING TREE (POHON BUNGA) ==================== -->
  <g opacity="0.9">
    <!-- Tree Trunk rooted at bottom-left -->
    <path d="M-5,505 Q22,460 25,410 Q28,365 20,330" stroke="#6b5035" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Tree branches -->
    <path d="M24,420 Q48,395 72,402" stroke="#7a6040" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <path d="M60,400 Q80,380 96,388" stroke="#8a7050" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M22,355 Q42,340 58,348" stroke="#7a6040" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M50,345 Q68,328 85,334" stroke="#8a7050" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M20,330 Q15,305 32,295" stroke="#7a6040" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Dark & Teal Foliage puffs -->
    <ellipse cx="20" cy="485" rx="35" ry="20" fill="url(#cardTealLeaf)" opacity="0.75"/>
    <ellipse cx="45" cy="470" rx="28" ry="16" fill="url(#cardSoftLeaf)" opacity="0.7"/>
    <ellipse cx="10" cy="450" rx="25" ry="15" fill="url(#cardTealLeaf)" opacity="0.8"/>

    <!-- Gold Foliage puffs -->
    <ellipse cx="35" cy="445" rx="20" ry="12" fill="url(#cardGold)" opacity="0.7" transform="rotate(-15 35 445)"/>
    <ellipse cx="65" cy="415" rx="16" ry="10" fill="url(#cardGold)" opacity="0.75" transform="rotate(15 65 415)"/>
    <ellipse cx="55" cy="358" rx="14" ry="8" fill="url(#cardGold)" opacity="0.8" transform="rotate(-10 55 358)"/>

    <!-- Cherry Blossom Clusters on Bottom Tree -->
    <g transform="translate(96, 388)">
      <circle cx="0" cy="-7.5" r="6" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="7" cy="-2.5" r="6" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="4.5" cy="6" r="6" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="-4.5" cy="6" r="6" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="-7" cy="-2.5" r="6" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="0" cy="0" r="3" fill="url(#cardCenter)"/>
    </g>

    <g transform="translate(74, 404)">
      <circle cx="0" cy="-6" r="4.8" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="5.5" cy="-2" r="4.8" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="3.5" cy="5" r="4.8" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="-3.5" cy="5" r="4.8" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="-5.5" cy="-2" r="4.8" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="0" cy="0" r="2.4" fill="url(#cardCenter)"/>
    </g>

    <g transform="translate(85, 334)">
      <circle cx="0" cy="-7" r="5.5" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="6.5" cy="-2" r="5.5" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="4" cy="5.5" r="5.5" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="-4" cy="5.5" r="5.5" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="-6.5" cy="-2" r="5.5" fill="url(#cardPetal)" stroke="url(#cardGold)" stroke-width="0.4"/>
      <circle cx="0" cy="0" r="2.8" fill="url(#cardCenter)"/>
    </g>

    <g transform="translate(32, 295)">
      <circle cx="0" cy="-5" r="4.2" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="4.8" cy="-1.5" r="4.2" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="3" cy="4.2" r="4.2" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="-3" cy="4.2" r="4.2" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="-4.8" cy="-1.5" r="4.2" fill="url(#cardPetalPink)" stroke="url(#cardGold)" stroke-width="0.3"/>
      <circle cx="0" cy="0" r="2" fill="url(#cardCenter)"/>
    </g>

    <!-- Drifted Petals -->
    <ellipse cx="60" cy="460" rx="4" ry="2.2" fill="url(#cardPetal)" opacity="0.7" transform="rotate(30 60 460)"/>
    <ellipse cx="90" cy="430" rx="3.5" ry="2" fill="url(#cardPetalPink)" opacity="0.65" transform="rotate(-20 90 430)"/>
    <ellipse cx="40" cy="380" rx="3.5" ry="1.8" fill="url(#cardPetal)" opacity="0.6" transform="rotate(15 40 380)"/>
  </g>
</svg>
