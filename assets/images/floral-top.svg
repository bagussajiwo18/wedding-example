<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" fill="none">
    <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E8D39E"/>
            <stop offset="50%" stop-color="#C9A85C"/>
            <stop offset="100%" stop-color="#A9873E"/>
        </linearGradient>
        <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#849483"/>
            <stop offset="100%" stop-color="#556354"/>
        </linearGradient>
        <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#F5EFE6" stop-opacity="0.75"/>
        </linearGradient>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Center Branch -->
    <path d="M 50,40 Q 150,110 250,85 T 450,40" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 80,45 Q 180,95 250,85 T 420,45" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
    
    <!-- Leaves Left -->
    <path d="M 120,70 Q 100,50 110,35 Q 130,50 120,70 Z" fill="url(#leafGrad)" opacity="0.85"/>
    <path d="M 150,85 Q 130,70 145,55 Q 165,70 150,85 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M 180,88 Q 165,110 180,125 Q 195,105 180,88 Z" fill="url(#leafGrad)" opacity="0.8"/>
    <path d="M 210,87 Q 200,60 215,45 Q 230,65 210,87 Z" fill="url(#leafGrad)" opacity="0.85"/>
    
    <!-- Leaves Right -->
    <path d="M 380,70 Q 400,50 390,35 Q 370,50 380,70 Z" fill="url(#leafGrad)" opacity="0.85"/>
    <path d="M 350,85 Q 370,70 355,55 Q 335,70 350,85 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M 320,88 Q 335,110 320,125 Q 305,105 320,88 Z" fill="url(#leafGrad)" opacity="0.8"/>
    <path d="M 290,87 Q 300,60 285,45 Q 270,65 290,87 Z" fill="url(#leafGrad)" opacity="0.85"/>
    
    <!-- Center Bloom -->
    <g transform="translate(250, 85)" filter="url(#softGlow)">
        <!-- Petals -->
        <ellipse cx="0" cy="-22" rx="14" ry="24" fill="url(#petalGrad)" stroke="url(#goldGrad)" stroke-width="0.8"/>
        <ellipse cx="-18" cy="-12" rx="14" ry="22" transform="rotate(-40 -18 -12)" fill="url(#petalGrad)" stroke="url(#goldGrad)" stroke-width="0.8"/>
        <ellipse cx="18" cy="-12" rx="14" ry="22" transform="rotate(40 18 -12)" fill="url(#petalGrad)" stroke="url(#goldGrad)" stroke-width="0.8"/>
        <ellipse cx="-20" cy="10" rx="13" ry="20" transform="rotate(-80 -20 10)" fill="url(#petalGrad)" stroke="url(#goldGrad)" stroke-width="0.8"/>
        <ellipse cx="20" cy="10" rx="13" ry="20" transform="rotate(80 20 10)" fill="url(#petalGrad)" stroke="url(#goldGrad)" stroke-width="0.8"/>
        <ellipse cx="0" cy="18" rx="14" ry="20" fill="url(#petalGrad)" stroke="url(#goldGrad)" stroke-width="0.8"/>
        
        <!-- Center Stamen -->
        <circle cx="0" cy="0" r="10" fill="url(#goldGrad)"/>
        <circle cx="-3" cy="-3" r="2" fill="#FFFFFF" opacity="0.8"/>
        <circle cx="3" cy="-2" r="1.5" fill="#FFFFFF" opacity="0.8"/>
        <circle cx="0" cy="3" r="2" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- Small side buds -->
    <circle cx="160" cy="55" r="5" fill="url(#goldGrad)"/>
    <circle cx="340" cy="55" r="5" fill="url(#goldGrad)"/>
    <circle cx="95" cy="40" r="3.5" fill="url(#goldGrad)"/>
    <circle cx="405" cy="40" r="3.5" fill="url(#goldGrad)"/>
</svg>
