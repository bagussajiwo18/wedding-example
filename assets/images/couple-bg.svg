<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="coupleSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8ecee"/>
      <stop offset="40%" stop-color="#f0f3f5"/>
      <stop offset="75%" stop-color="#f5f7f8"/>
      <stop offset="100%" stop-color="#e2e8ec"/>
    </linearGradient>
    <linearGradient id="cGoldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b86e"/>
      <stop offset="50%" stop-color="#b99650"/>
      <stop offset="100%" stop-color="#8a6e30"/>
    </linearGradient>
    <linearGradient id="cGoldLeaf2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8cfa0"/>
      <stop offset="60%" stop-color="#c9a858"/>
      <stop offset="100%" stop-color="#9a7832"/>
    </linearGradient>
    <linearGradient id="cPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#e8dece"/>
    </linearGradient>
    <linearGradient id="cPetal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf8f0"/>
      <stop offset="60%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#e0d0b8"/>
    </linearGradient>
    <radialGradient id="cFlowerCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0d898"/>
      <stop offset="70%" stop-color="#d4a84e"/>
      <stop offset="100%" stop-color="#a87828"/>
    </radialGradient>
    <linearGradient id="cDarkLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a5060"/>
      <stop offset="100%" stop-color="#263540"/>
    </linearGradient>
    <linearGradient id="cMidLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e6878"/>
      <stop offset="100%" stop-color="#324858"/>
    </linearGradient>
    <filter id="cMist">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="cSoftBlur">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <!-- Base sky background -->
  <rect width="450" height="900" fill="url(#coupleSky)"/>

  <!-- Subtle wave lines (Japanese aesthetic, top area only) -->
